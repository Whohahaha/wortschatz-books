name: Publish word books

# Builds the word books from sources/ and publishes them in two steps: first the word lists, so
# they can be downloaded right away, then the pronunciation, synthesized with Piper (offline
# neural TTS, German "thorsten" voice, CC0). Synthesis is slow; recordings are cached after every
# run, even an unfinished one, so running the workflow again carries on where it stopped. A book
# only gets a new version when its word list changed or its recordings became complete.
on:
  push:
    branches: [main]
    paths: ["sources/**", "tools/**", "base/**", "books.json", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Plurals and verb forms not written in the sources, from Wiktionary via kaikki.org.
      - name: Restore lexicon
        id: lexicon
        uses: actions/cache@v4
        with:
          path: .lexicon
          key: lexicon-${{ hashFiles('tools/build_lexicon.py') }}

      - name: Build lexicon
        if: steps.lexicon.outputs.cache-hit != 'true'
        run: python tools/build_lexicon.py .lexicon/de.tsv.gz

      - name: Build word books
        run: python tools/build_all.py build .lexicon/de.tsv.gz

      - name: Publish word lists
        run: |
          python tools/publish.py build
          tools/commit.sh "Publish word books"

      - name: Restore generated audio
        uses: actions/cache/restore@v4
        with:
          path: .audio-cache
          key: audio-thorsten-high-${{ github.run_id }}
          restore-keys: audio-thorsten-high-

      - name: Generate pronunciation audio
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install piper-tts==1.3.0
          python -m piper.download_voices --data-dir .voices de_DE-thorsten-high
          # One Piper process per core, each on its own share of the texts; stop in time to save
          # what was made, so the next run continues from there.
          shards=$(nproc)
          for manifest in build/*.manifest; do
            id=$(basename "$manifest" .manifest)
            split -n "l/$shards" -d "$manifest" "build/$id.shard."
            for shard in build/$id.shard.*; do
              timeout 270m python tools/gen_audio.py "$shard" .voices/de_DE-thorsten-high.onnx .audio-cache "build/audio/$id" &
            done
            wait || true
          done

      - name: Save generated audio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .audio-cache
          key: audio-thorsten-high-${{ github.run_id }}

      - name: Publish pronunciation
        run: |
          python tools/publish.py build --audio
          tools/commit.sh "Publish word book pronunciation"
